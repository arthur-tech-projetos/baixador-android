name: Compilar APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar (debug)
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Baixador-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Baixador-debug-apk
          path: Baixador-debug.apk

      # Publica sempre no mesmo endereço, para o painel baixar sem senha:
      # https://github.com/USUARIO/REPOSITORIO/releases/download/dev-latest/Baixador-debug.apk
      - name: Publicar em dev-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest Baixador-debug.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Build de teste" \
            --notes "Compilado automaticamente a partir do commit ${{ github.sha }}"
